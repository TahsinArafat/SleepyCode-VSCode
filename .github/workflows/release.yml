name: Package VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate release metadata
        run: npm run verify:release
        env:
          SLEEPYCODE_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: npm run check
      - run: npm run build
      - name: Package extension
        shell: bash
        run: |
          mkdir -p artifacts
          VERSION=$(node -p "require('./package.json').version")
          npx vsce package --out "artifacts/sleepycode-${VERSION}.vsix"
      - uses: actions/upload-artifact@v5
        with:
          name: sleepycode-vsix
          path: artifacts/*.vsix
          if-no-files-found: error
