name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # `check` builds first itself (package-shape asserts the built webview
      # bundles ship), so a clean checkout needs no separate build step. The
      # browser suites need the matching Chromium binary on disk.
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run check
      - run: npm run build
      # The browser harnesses. `check` deliberately stays browser-free so a local run
      # does not need Chromium; CI installs it, so this is the only place the shipping
      # webview bundle is actually driven. perf-probe asserts the *shape* of streaming
      # cost (early vs late delta), not wall-clock speed, so a slow runner cannot fail it
      # and a quadratic re-render cannot pass it. ui-shots fails on overflow or console
      # errors at three widths.
      - run: npm run check:perf
