name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # `check` builds first itself (package-shape asserts the built webview
      # bundles ship), so a clean checkout needs no separate build step. The
      # browser suites need the matching Chromium binary on disk.
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run check
      - run: npm run build
